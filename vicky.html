<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* =========================
       ANIMATED BACKGROUND
    ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .gradient {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            animation: float 14s ease-in-out infinite;
        }

        .gradient.one {
            background: #5b5cff;
            top: -300px;
            left: -200px;
        }

        .gradient.two {
            background: #00d4a8;
            bottom: -350px;
            right: -200px;
            animation-delay: -5s;
        }

        .gradient.three {
            background: #a855f7;
            top: 35%;
            left: 45%;
            width: 400px;
            height: 400px;
            opacity: 0.18;
            animation-delay: -9s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(70px, -50px) scale(1.15);
            }
        }

        /* =========================
       SUBTLE MOVING STARS
    ========================= */

        .stars {
            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(circle,
                    rgba(255, 255, 255, .5) 1px,
                    transparent 1px),
                radial-gradient(circle,
                    rgba(255, 255, 255, .25) 1px,
                    transparent 1px);

            background-size: 90px 90px, 140px 140px;
            background-position: 0 0, 40px 60px;

            opacity: 0.25;

            animation: drift 30s linear infinite;
        }

        @keyframes drift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-90px);
            }
        }

        /* =========================
       MAIN CARD
    ========================= */

        .container {
            position: relative;
            z-index: 2;

            width: min(90%, 900px);

            padding: 75px 55px;

            text-align: center;

            background: rgba(255, 255, 255, 0.045);

            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: 30px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, .45),
                inset 0 1px 0 rgba(255, 255, 255, .05);

            animation: appear 1.2s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
       BRAND
    ========================= */

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 45px;

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: rgba(255, 255, 255, .85);
        }

        .brand-dot {
            width: 9px;
            height: 9px;

            background: #7c7cff;

            border-radius: 50%;

            box-shadow: 0 0 20px #7c7cff;

            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: .7;
            }

            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }

        /* =========================
       MAIN TAGLINE
    ========================= */

        .tagline {
            font-size: clamp(42px, 7vw, 76px);

            line-height: 1.05;

            letter-spacing: -3px;

            font-weight: 700;

            max-width: 800px;

            margin: 0 auto 25px;

            background: linear-gradient(120deg,
                    #ffffff 20%,
                    #aaaaff 50%,
                    #75f5d6 80%);

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            background-size: 200% auto;

            animation: shine 6s ease-in-out infinite;
        }

        @keyframes shine {

            0%,
            100% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }
        }

        /* =========================
       COMING SOON
    ========================= */

        .coming {
            font-size: clamp(20px, 3vw, 28px);

            font-weight: 500;

            letter-spacing: 8px;

            text-transform: uppercase;

            color: rgba(255, 255, 255, .65);

            margin-bottom: 30px;
        }

        /* =========================
       DESCRIPTION
    ========================= */

        .subtitle {
            max-width: 570px;

            margin: auto;

            color: rgba(255, 255, 255, .48);

            font-size: 17px;

            line-height: 1.7;

            font-weight: 400;
        }

        /* =========================
       BADGE
    ========================= */

        .badge {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 42px;

            padding: 10px 18px;

            border-radius: 100px;

            border: 1px solid rgba(255, 255, 255, .1);

            background: rgba(255, 255, 255, .05);

            color: rgba(255, 255, 255, .7);

            font-size: 12px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .badge span {
            display: inline-block;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #69eacb;

            box-shadow: 0 0 12px #69eacb;
        }

        /* =========================
       FOOTER
    ========================= */

        .footer {
            position: fixed;

            z-index: 3;

            bottom: 25px;

            left: 0;

            width: 100%;

            text-align: center;

            font-size: 12px;

            color: rgba(255, 255, 255, .3);

            letter-spacing: 1px;
        }

        /* =========================
       MOBILE
    ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 55px 25px;

                border-radius: 24px;
            }

            .brand {
                margin-bottom: 35px;
            }

            .tagline {
                letter-spacing: -2px;
            }

            .coming {
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 15px;
            }

            .gradient {
                filter: blur(90px);
            }
        }
    </style>
</head>

<body>

    <div class="background">

        <div class="gradient one"></div>
        <div class="gradient two"></div>
        <div class="gradient three"></div>

        <div class="stars"></div>

    </div>


    <main class="container">

        <!-- imgsr-->
        <img src="https://i.postimg.cc/7h05nf4B/Vickj.pngW" alt="logo" width="100" height="100">
        <div class="brand">





        </div>


        <!-- MAIN TAGLINE -->

        <h1 class="tagline">

            Great things begin with great minds.<br>

        </h1>


        <!-- COMING SOON -->

        <div class="coming">

            Coming Soon

        </div>


        <p class="subtitle">

            Something remarkable is taking shape.
            We're working quietly behind the scenes
            to bring you something worth waiting for.

        </p>


        <div class="badge">

            <span></span>

            Stay tuned

        </div>

    </main>


    <div class="footer">

        © 2026 Vicky

    </div>


</body>

</html>
